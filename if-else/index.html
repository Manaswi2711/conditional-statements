<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        //Check if a number is a factor of 96

        var n =prompt("Enter a number")
        if (96%n==0){
            console.log("n is a factor of 96")
        }
        else{
            console.log("n is not a factor of 96")
        }
    </script>
</body>
